
x-storage-node: &storage-node
  build: .
  command: ["python", "-m", "dfs.node"]   # placeholder, built in a later task
  profiles: ["nodes"]                     # keeps plain `docker compose up` working
  restart: unless-stopped

services:
  node1:
    <<: *storage-node
    hostname: node1
    environment: { NODE_ID: node1, DATA_DIR: /data, PORT: "8000" }
    ports: ["8101:8000"]
    volumes: ["${DFS_DATA_ROOT:-./data}/node1:/data"]
  # node2 -> 8102, node3 -> 8103, node4 -> 8104, same pattern
 
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # management UI
      - "15692:15692" # Prometheus metrics

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

volumes:
  grafana-data:
